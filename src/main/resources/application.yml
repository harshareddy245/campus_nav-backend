server:
  port: 8080

spring:
  application:
    name: campusnav-backend

  datasource:
    url: jdbc:h2:mem:campusnavdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  cache:
    type: simple
    cache-names:
      - locations
      - buildings
      - routes

# JWT Security Configuration
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  ai:
    # Optional external API key; built-in RAG engine is active by default
    api-key: ${CAMPUSNAV_AI_KEY:}
    model: gemini-1.5-flash

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Swagger OpenAPI docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
